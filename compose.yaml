services:
  postgres:
    image: postgres:16-alpine
    container_name: citumang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: citumang
      POSTGRES_USER: citumang
      POSTGRES_PASSWORD: citumang-local
    ports:
      - "5432:5432"
    volumes:
      - citumang-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citumang -d citumang"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  citumang-postgres-data:
