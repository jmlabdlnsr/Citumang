services:
  postgres:
    image: postgres:16-alpine
    container_name: citumang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: citumang
      POSTGRES_USER: citumang
      POSTGRES_PASSWORD: citumang-local
    ports:
      - "5432:5432"
    volumes:
      - citumang-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citumang -d citumang"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO — S3-compatible object storage ────────────────────────────────────
  # Port sesuai rancangan §5.2: API 9002, Console 9003 (bukan 9000 — konflik Portainer)
  #
  # Dev lokal: docker compose up -d minio
  #   Image resmi MinIO memerlukan `docker login` jika pull gagal:
  #     docker login && docker compose up -d minio
  #   Setelah MinIO jalan pertama kali, buat bucket dengan:
  #     PowerShell : .\scripts\setup-minio.ps1
  #     Linux/Mac  : bash scripts/setup-minio.sh
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: citumang-minio
    restart: unless-stopped
    command: server /data --console-address ":9003" --address ":9002"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-local
    ports:
      - "9002:9002"   # S3 API — diakses app via MINIO_ENDPOINT=localhost:9002
      - "9003:9003"   # Web Console — LAN saja, jangan diekspos ke internet
    volumes:
      - citumang-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  citumang-postgres-data:
  citumang-minio-data:
